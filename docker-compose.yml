services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-fatecpoll}
      MARIADB_USER: ${DB_USER:-fatecpoll}
      MARIADB_PASSWORD: ${DB_PASS:-fatecpoll}
      TZ: America/Sao_Paulo
    volumes:
      - db_data:/var/lib/mysql
      # Scripts .sql desta pasta rodam automaticamente na criação do banco (1ª subida)
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-fatecpoll}
      DB_USER: ${DB_USER:-fatecpoll}
      DB_PASS: ${DB_PASS:-fatecpoll}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@fatecpoll.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SEED_DEMO: ${SEED_DEMO:-1}
      APP_DEBUG: ${APP_DEBUG:-1}
      APP_URL: ${APP_URL:-}
      APP_KEY: ${APP_KEY:-}
      DUPLICATE_SIGNAL: ${DUPLICATE_SIGNAL:-flag}
      # E-mail: por padrão cai no Mailpit (caixa de teste em http://localhost:8025).
      # Para enviar de verdade, defina SMTP_* no .env (veja .env.example).
      MAIL_DRIVER: ${MAIL_DRIVER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-none}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-nao-responder@fatecpoll.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-FatecPoll}
    volumes:
      # Desenvolvimento: edita o código no seu editor e atualiza o navegador
      - ./:/var/www/html

  # Caixa de e-mail de teste: todo e-mail enviado pelo app aparece em http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"

  # Opcional: docker compose --profile tools up -d  →  http://localhost:8081
  adminer:
    image: adminer:4
    profiles: ["tools"]
    depends_on: [db]
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  db_data:
